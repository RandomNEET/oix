id = "custom/theme-switcher"
name = "Theme Switcher"
version = "1.0.0"
plugin_api = 3
min_noctalia = "5.0.0"
icon = "palette"
description = "Switch home-manager specialisation themes from the launcher."

[[setting]]
key = "base_gen"
type = "string"
label_key = "settings.base_gen.label"
description_key = "settings.base_gen.description"
default = "~/.local/state/nix/profiles/home-manager-base"

[[setting]]
key = "spec_dir"
type = "string"
label_key = "settings.spec_dir.label"
description_key = "settings.spec_dir.description"
default = "~/.local/state/nix/profiles/home-manager-base/specialisation"

[[launcher_provider]]
id = "themes"
entry = "launcher.luau"
prefix = "theme"
glyph = "palette"
include_in_global_search = false
debounce_ms = 150
